name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # `uv sync` follows uv.lock, which pins the CUDA wheels on Linux (~3 GB of nvidia-* packages).
      # `--torch-backend` is only honoured by `uv pip`, so install through it to get CPU-only torch.
      - name: Install (CPU torch)
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]" --torch-backend cpu
      - name: Check no CUDA wheels
        run: "! uv pip list | grep -i nvidia"
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Unit tests
        run: uv run --no-sync pytest -q
