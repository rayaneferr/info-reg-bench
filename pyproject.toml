[project]
name = "info-reg-bench"
version = "0.1.0"
description = "Benchmark of explicit information-theoretic regularization for LLM fine-tuning (Qwen2.5-0.5B + LoRA, MNLI -> HANS)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch>=2.4",
  "transformers>=4.45",
  "peft>=0.13",
  "datasets>=3.0",
  "numpy",
  "pandas",
  "matplotlib",
  "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["inforeg"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E402", "E701", "E702"]

[tool.pytest.ini_options]
testpaths = ["tests"]
