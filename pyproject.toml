[project]
name = "info-reg-bench"
version = "0.2.0"
description = "Benchmark of explicit information-theoretic regularization for LLM fine-tuning (Qwen2.5-0.5B + LoRA, MNLI -> HANS)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch>=2.4",
  "transformers>=4.45",
  "peft>=0.13",
  "datasets>=3.0",
  "numpy",
  "pandas",
  "matplotlib",
  "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["inforeg"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# E/F/W/I: pycodestyle, pyflakes, isort · B: bugbear · UP: pyupgrade · C4: comprehensions
# SIM: simplify · NPY: numpy · PT: pytest · RUF100: stale noqa
select = ["E", "F", "I", "W", "B", "UP", "C4", "SIM", "NPY", "PT", "RUF100"]
# compound one-liners are used on purpose for short plotting / seeding statements;
# dict(...) keeps the GRID readable as keyword arguments; an if/else reads better than a ternary
# for the VIB reparameterisation
ignore = ["E402", "E701", "E702", "C408", "SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]   # tests import main.py from the repo root
